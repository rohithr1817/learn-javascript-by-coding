<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassList Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="myBox" class="box">
        Click the buttons to change my class!
    </div>
    <button id="addClass">Add Class</button>
    <button id="removeClass">Remove Class</button>
    <button id="toggleClass">Toggle Class</button>
    <button id="checkClass">Check Class</button>
   
    <br><br>
    <hr>
    <br><br>

    <button id="myButton">My Button</button>

    <br><br>
    <hr>
    <br><br>

    <button  class="btn4">button1</button>
    <button  class="btn4">button2</button>
    <button  class="btn4">button3</button>
    <button  class="btn4">button4</button>
    <script src="app.js"></script>
</body>
</html>
